name: Publish docs via GitHub Pages
on:
  push:
    branches:
      - main
    # Only rebuild+redeploy the site when the docs sources or build config
    # actually change — not on every unrelated push to main.
    paths:
      - "docs/**"
      - "zensical.toml"
      - "pyproject.toml"
      - ".github/workflows/mkdocs.yaml"
  # Build only: the deploy job below runs on push. A page or nav that breaks
  # the build then fails the pull request instead of the site on main.
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - "pyproject.toml"
      - ".github/workflows/mkdocs.yaml"

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: |
          pip install "$(grep -oE 'zensical==[0-9.]+' pyproject.toml)"

      - name: Build docs
        run: zensical build

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: "site"

  # Never runs for a pull request: the Pages permissions, the environment and
  # the deployment all live in this job only.
  deploy:
    name: Deploy docs
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
