on:
  push:
    branches:
      - main

# release-please authenticates with RELEASE_PLEASE_TOKEN, not the workflow
# token; the two jobs that write with the workflow token declare it themselves.
permissions:
  contents: read

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .release-please-config.json

  # Publish the RBAC chart to the GitHub Container Registry as an OCI artifact:
  #   helm install ... oci://ghcr.io/tibuntu/charts/homeassistant-kubernetes-rbac
  #
  # The chart has its own version (chart/Chart.yaml, bumped by hand) and is
  # released independently of the integration: every push to main publishes the
  # version it carries, unless the tag chart-v<version> already exists, and then
  # creates that tag. The tag is the "already published" marker.
  #
  # Deliberately a plain git tag, never a GitHub Release: HACS lists this
  # repository's releases as integration versions, and a chart release has no
  # kubernetes.zip to install.
  publish-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    # Two quick pushes to main must not both publish and then race for the tag.
    concurrency:
      group: publish-chart
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # git ls-remote --exit-code: 0 = tag exists, 2 = no such tag. Anything
      # else is a failed lookup and must not be read as "not published".
      - name: Check whether this chart version is already published
        id: chart
        run: |
          version=$(grep -m1 '^version:' chart/Chart.yaml | awk '{print $2}')
          tag="chart-v$version"
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || rc=$?
          case "$rc" in
            0) publish=false; echo "Chart $version is already published ($tag exists)." ;;
            2) publish=true; echo "Publishing chart $version." ;;
            *) echo "::error::could not look up $tag (git ls-remote exit $rc)"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        if: steps.chart.outputs.publish == 'true'
        with:
          version: v4.3.2

      - name: Log in to ghcr.io
        if: steps.chart.outputs.publish == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push
        if: steps.chart.outputs.publish == 'true'
        run: |
          helm package chart --destination dist
          helm push dist/homeassistant-kubernetes-rbac-*.tgz \
            oci://ghcr.io/${{ github.repository_owner }}/charts

      # Tag last: if the push above fails there is no tag, so the next push to
      # main (or a re-run of this job) publishes again.
      - name: Tag the published chart version
        if: steps.chart.outputs.publish == 'true'
        env:
          TAG: ${{ steps.chart.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

  # HACS installs the integration from the release asset named in hacs.json
  # (`filename`, with `zip_release`) and shows that asset's download count on the
  # integration page. A release without it cannot be installed through HACS.
  # The zip holds the contents of custom_components/kubernetes/ at its root,
  # because HACS extracts it straight into that directory.
  release-asset:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Attach the integration zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          file=$(jq -r .filename hacs.json)
          git archive --format=zip -o "$file" HEAD:custom_components/kubernetes
          gh release upload "$TAG" "$file" --clobber
