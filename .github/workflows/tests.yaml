---
name: Ruff and Pytest

on:
  push:
    branches:
      - main
  pull_request:
    branches-ignore:
      - release-please--branches--main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# Cancel superseded PR runs; never cancel the post-merge run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.15"

jobs:
  # Skip the post-merge re-run on main when the commit already arrived via a
  # merged PR (validated there). Direct pushes to main still run.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          prs=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq 'length')
          if [ "$prs" -gt 0 ]; then
            echo "From a merged PR — already validated; skipping main re-run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint, Type Check & Security
    needs: gate
    runs-on: ubuntu-latest
    if: >-
      needs.gate.outputs.run == 'true' &&
      (github.event_name != 'pull_request' || github.head_ref != 'release-please--branches--main')

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv and Python ${{ env.PYTHON_VERSION }}
        id: setup-uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          activate-environment: true
          # setup-uv only restores on an exact key match, so every pyproject
          # bump would rebuild the source-only wheels; actions/cache below
          # falls back to the previous cache instead.
          enable-cache: false

      # Keyed on the minor version: wheels built for cp315 stay valid across
      # Python patch releases, which runner images do not roll out in step.
      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Type check with mypy
        run: |
          mypy custom_components/

      - name: Security scan with Bandit
        run: |
          bandit -c pyproject.toml -r custom_components/

      # Keep only the wheels uv built from source; PyPI wheels are re-fetched.
      # Called by path: homeassistant pins an older uv into .venv/bin, which
      # sees this uv's cache buckets as stale and deletes all of them.
      - name: Prune uv cache
        run: ${{ steps.setup-uv.outputs.uv-path }} cache prune --ci

  test:
    name: Test & Coverage
    needs: gate
    runs-on: ubuntu-latest
    if: >-
      needs.gate.outputs.run == 'true' &&
      (github.event_name != 'pull_request' || github.head_ref != 'release-please--branches--main')

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv and Python ${{ env.PYTHON_VERSION }}
        id: setup-uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          activate-environment: true
          # setup-uv only restores on an exact key match, so every pyproject
          # bump would rebuild the source-only wheels; actions/cache below
          # falls back to the previous cache instead.
          enable-cache: false

      # Keyed on the minor version: wheels built for cp315 stay valid across
      # Python patch releases, which runner images do not roll out in step.
      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Test with pytest
        run: |
          pytest --cov-report=xml

      # Keep only the wheels uv built from source; PyPI wheels are re-fetched.
      # Called by path: homeassistant pins an older uv into .venv/bin, which
      # sees this uv's cache buckets as stale and deletes all of them.
      - name: Prune uv cache
        run: ${{ steps.setup-uv.outputs.uv-path }} cache prune --ci

      - name: Upload coverage to Codecov
        if: github.ref != 'refs/heads/release-please--branches--main'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: false
