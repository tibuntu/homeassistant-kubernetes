# Pre-commit configuration for code quality enforcement
# Install with: pip install pre-commit && pre-commit install

repos:
  # General code formatting and cleanup
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Remove trailing whitespace
        exclude: ^custom_components/kubernetes/frontend/
      - id: end-of-file-fixer
        name: Ensure files end with newline
        exclude: ^custom_components/kubernetes/frontend/
      - id: check-yaml
        name: Validate YAML files
        args: [--unsafe] # Allow custom YAML tags
        exclude: ^chart/templates/ # Go templates, not parseable YAML
      - id: check-json
        name: Validate JSON files

  # YAML formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: Format YAML/JSON files
        types_or: [yaml]
        args: [--write]
        # chart/templates/: Go templates. manifests/: generated by
        # scripts/render-manifests.sh — reformatting them would break the
        # drift check in .github/workflows/helm.yaml.
        exclude: ^(chart/templates/|manifests/)

  # Python linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        name: Lint Python code with Ruff
        args: [--fix]
      - id: ruff-format
        name: Format Python code with Ruff

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        name: Type check with mypy
        args:
          - --ignore-missing-imports
          - --strict-optional
          - --warn-redundant-casts
          - --warn-unused-ignores
        files: ^custom_components/

  # Security linting
  - repo: https://github.com/pycqa/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: Security check with Bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]

  # Frontend linting and formatting
  - repo: local
    hooks:
      - id: frontend-eslint
        name: Lint frontend TypeScript with ESLint
        entry: bash -c 'cd frontend && ./node_modules/.bin/eslint src/'
        language: system
        files: ^frontend/src/.*\.ts$
        pass_filenames: false

      - id: frontend-prettier
        name: Check frontend formatting with Prettier
        entry: bash -c 'cd frontend && ./node_modules/.bin/prettier --check "src/**/*.ts"'
        language: system
        files: ^frontend/src/.*\.ts$
        pass_filenames: false

      - id: frontend-typecheck
        name: Typecheck frontend TypeScript
        entry: bash -c 'cd frontend && ./node_modules/.bin/tsc --noEmit -p tsconfig.json'
        language: system
        files: ^frontend/src/.*\.ts$
        pass_filenames: false

# Pre-commit configuration
default_language_version:
  python: python3.13

# Exclude patterns
exclude: |
  (?x)^(
    \.git/.*|
    \.pytest_cache/.*|
    __pycache__/.*|
    \.mypy_cache/.*|
    site/.*
  )$

# Fail fast - stop on first failure
fail_fast: false

# Default stages
default_stages: [pre-commit, pre-push]

# CI configuration
ci:
  # Skip these hooks in CI (they run in separate jobs)
  skip: [markdownlint]
  # Auto-fix pull requests
  autofix_prs: true
  # Auto-update configuration
  autoupdate_schedule: weekly
