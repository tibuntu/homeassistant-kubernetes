{{/* mode is validated by values.schema.json — enforced on every render, including
     when rbac.create is false, which a template-level `fail` here would miss. */}}
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rbac.name" . }}
  labels:
    {{- include "rbac.labels" . | nindent 4 }}
{{- if eq .Values.mode "full" }}
# Permissions for every integration feature. Each rule maps to a request the
# integration sends; docs/RBAC.md names the feature behind every verb.
# For a read-only setup use manifests/minimal/ (Helm: mode=minimal) instead.
rules:
  # --- Monitoring: read + Watch API, always cluster-wide ---
  # pods: `get` is the pod detail dialog in the sidebar panel
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # events: Cluster Events platform + events in the pod detail dialog
  - apiGroups: [""]
    resources: ["nodes", "services", "events"]
    verbs: ["list", "watch"]
  # namespaces: namespace selection in the config flow
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["list", "watch"]
  # cronjobs: `get` reads the job template when a CronJob is triggered
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["list", "watch"]
  # Gateway API HTTPRoutes and cert-manager Certificates are optional; the
  # rules are harmless when the CRDs are not installed. Secrets are never read.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["list", "watch"]
  # HPA detection (scale guard + HPA badge)
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list", "watch"]
  # Metrics API — CPU and memory usage (requires metrics-server)
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["list"]

  # --- Node control: cordon/uncordon (nodes have no namespace) ---
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["patch"]
  {{- if has "*" .Values.rbac.writeNamespaces }}

  # --- Control of namespaced resources ---
  {{- include "rbac.writeRules" . | nindent 2 }}
  {{- end }}
{{- else }}
# Minimal read-only permissions for sensors and binary sensors only.
# Switches (deployment/statefulset scaling, cronjob suspension, node
# cordon/uncordon), rollout restart, pod/job deletion, pod logs, the Cluster
# Events platform and the Watch API are NOT available with this role.
# For full functionality use manifests/full/ (Helm: mode=full) instead.
rules:
  # pods: `get` is the pod detail dialog in the sidebar panel
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "services"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["list"]
  # Gateway API HTTPRoutes and cert-manager Certificates (CRDs may be absent)
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["list"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["list"]
  # HPA detection
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list"]
  # Metrics API — CPU and memory usage (requires metrics-server)
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["list"]
{{- end }}
{{- with .Values.rbac.extraRules }}

  # Extra rules from .Values.rbac.extraRules
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
