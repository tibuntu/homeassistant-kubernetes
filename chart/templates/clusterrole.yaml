{{/* mode is validated by values.schema.json — enforced on every render, including
     when rbac.create is false, which a template-level `fail` here would miss. */}}
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rbac.name" . }}
  labels:
    {{- include "rbac.labels" . | nindent 4 }}
{{- if eq .Values.mode "full" }}
# Full permissions for all integration features:
#   - Sensors and binary sensors (monitoring)
#   - Switches (deployment/statefulset scaling, cronjob suspension,
#     node cordon/uncordon)
#   - Workload rollout restart (deployments, statefulsets, daemonsets)
#   - Pod and Job deletion from the sidebar panel
#   - Cluster Events platform (events)
#   - Experimental Watch API (real-time updates via ?watch=true)
#   - Legacy API compatibility (Kubernetes < 1.16)
# For a read-only setup use manifests/minimal/ (Helm: mode=minimal) instead.
rules:
  # Core resources — monitoring + watch + pod deletion
  # nodes: patch is what cordon/uncordon needs (spec.unschedulable)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["namespaces", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]

  # Apps resources — monitoring + watch
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]

  # Apps resources — rollout restart
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["patch"]

  # Apps resources — scaling control
  - apiGroups: ["apps"]
    resources:
      - deployments/scale
      - statefulsets/scale
      - statefulsets/status
    verbs: ["get", "patch", "update"]

  # Batch resources — monitoring + watch + cronjob triggering + job deletion
  - apiGroups: ["batch"]
    resources: ["cronjobs", "cronjobs/status", "jobs"]
    verbs: ["get", "list", "watch", "patch", "update", "create", "delete"]

  # Networking resources — monitoring + watch (Ingress URLs in the panel)
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]

  # Metrics API — real-time CPU and memory usage (requires metrics-server)
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]

  # Legacy API compatibility (Kubernetes < 1.16)
  - apiGroups: ["extensions"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
{{- else }}
# Minimal read-only permissions for sensors and binary sensors only.
# Switches (deployment/statefulset scaling, cronjob suspension, node
# cordon/uncordon), rollout restart, pod/job deletion, the Cluster Events
# platform and the experimental Watch API are NOT available with this role.
# For full functionality use manifests/full/ (Helm: mode=full) instead.
rules:
  # Core resources — monitoring only
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list"]
  # Apps resources — monitoring only
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  # Batch resources — monitoring only
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list"]
  # Networking resources — monitoring only
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  # Metrics API — real-time CPU and memory usage (requires metrics-server)
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
{{- end }}
{{- with .Values.rbac.extraRules }}

  # Extra rules from .Values.rbac.extraRules
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
