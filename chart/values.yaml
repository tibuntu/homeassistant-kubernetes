# Permission set to grant.
#   full    — every integration feature: sensors, switches (scaling, CronJob
#             suspension, node cordon/uncordon), rollout restart, pod/job
#             deletion, Cluster Events, and the experimental Watch API.
#   minimal — read-only sensors and binary sensors. No switches, no Watch API.
# See docs/RBAC.md for the complete permission matrix.
mode: full

# Name of the ServiceAccount, ClusterRole and ClusterRoleBinding. The
# `<name>-write` ClusterRole and its RoleBindings (rbac.writeNamespaces) follow it.
# The default matches the plain manifests in manifests/ and the names used
# throughout the documentation — only change it if you know why.
nameOverride: ""

serviceAccount:
  create: true
  annotations: {}

# Long-lived `kubernetes.io/service-account-token` Secret.
# Required when Home Assistant runs OUTSIDE the cluster: you paste the token
# from this Secret into the config flow, and it never expires.
# Set to false when Home Assistant runs as a pod in this cluster — it then
# uses the projected (auto-rotating) ServiceAccount token instead.
tokenSecret:
  create: true

rbac:
  create: true
  # Where mode=full may change things: scale and restart workloads, delete
  # pods and Jobs, trigger and suspend CronJobs, evict pods (drain) and read
  # pod logs. Reading stays cluster-wide whatever this says.
  #   ["*"]          every namespace (default): one ClusterRole, cluster-wide.
  #                  "*" must stand alone; mixing it with names is rejected.
  #   [media, home]  only these: the rules are bound by one RoleBinding per
  #                  namespace. The namespaces must exist before install.
  #   []             nowhere.
  # Node cordon/uncordon is cluster-scoped and not affected. mode=minimal has
  # no write rules, so it accepts only ["*"] or [].
  # See docs/RBAC.md#limiting-write-access-to-namespaces
  writeNamespaces: ["*"]
  # Extra rules appended verbatim to the generated ClusterRole, e.g. to add
  # `events` access on top of `mode: minimal`:
  #   extraRules:
  #     - apiGroups: [""]
  #       resources: ["events"]
  #       verbs: ["list", "watch"]
  extraRules: []
