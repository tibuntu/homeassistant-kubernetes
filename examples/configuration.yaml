# Example Home Assistant configuration with Kubernetes integration
# Copy this to your configuration.yaml and customize as needed

# Home Assistant configuration
homeassistant:
  name: My Home
  latitude: 37.7749
  longitude: -122.4194
  elevation: 0
  unit_system: metric
  time_zone: America/Los_Angeles

# Enable logging for debugging
logger:
  default: info
  logs:
    custom_components.kubernetes: debug

# HTTP configuration
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1

# Frontend configuration
frontend:

# API configuration
api:

# The Kubernetes integration is set up entirely through the UI
# (Settings -> Devices & Services -> Add Integration -> Kubernetes) — it has
# no YAML configuration schema, so there is no "kubernetes:" block to add here.
# See docs/SETUP.md for the setup walkthrough.

# Example automations using the generic workload services

# Stop multiple workloads at once
automation:
  - alias: "Stop Multiple Workloads"
    trigger:
      platform: time
      at: "22:00:00"
    action:
      - service: kubernetes.stop_workload
        data:
          workload_names:
            - switch.production_default_web_app
            - switch.production_default_api_server
            - switch.production_default_cache_service
          namespace: "default"

  # Start multiple workloads with specific replica counts
  - alias: "Start Multiple Workloads"
    trigger:
      platform: time
      at: "06:00:00"
    action:
      - service: kubernetes.start_workload
        data:
          workload_names:
            - switch.production_default_web_app
            - switch.production_default_api_server
          replicas: 3
          namespace: "default"

  # Scale multiple StatefulSets
  - alias: "Scale Multiple StatefulSets"
    trigger:
      platform: time
      at: "08:00:00"
    action:
      - service: kubernetes.scale_workload
        data:
          workload_names:
            - switch.production_database_database_primary
            - switch.production_database_database_replica
          replicas: 2
          namespace: "database"

  # Single workload operations
  - alias: "Stop Single Workload"
    trigger:
      platform: time
      at: "23:00:00"
    action:
      - service: kubernetes.stop_workload
        data:
          workload_name: switch.production_monitoring_monitoring
          namespace: "monitoring"

  # Trigger a CronJob manually
  - alias: "Trigger Backup CronJob"
    trigger:
      platform: time
      at: "12:00:00"
    action:
      - service: kubernetes.start_workload
        data:
          workload_name: switch.production_default_backup
          namespace: "default"

  # Multiple workloads with different replica counts (requires multiple calls)
  - alias: "Scale Different Workloads"
    trigger:
      platform: time
      at: "09:00:00"
    action:
      - service: kubernetes.scale_workload
        data:
          workload_names:
            - switch.production_cache_redis_cache
            - switch.production_cache_redis_session
          replicas: 3
          namespace: "cache"
      - service: kubernetes.scale_workload
        data:
          workload_names:
            - switch.production_logging_elasticsearch_data
            - switch.production_logging_elasticsearch_master
          replicas: 1
          namespace: "logging"

# Example scripts for manual control
script:
  kubernetes_status_check:
    alias: "Check Kubernetes Status"
    sequence:
      - service: homeassistant.update_entity
        target:
          entity_id:
            - sensor.production_pods_count
            - sensor.production_nodes_count

            - sensor.production_deployments_count
            - binary_sensor.production_cluster_health

  scale_production_api:
    alias: "Scale Production API"
    sequence:
      - service: kubernetes.scale_workload
        data:
          workload_name: switch.production_default_api
          replicas: 3
          namespace: default

  stop_development:
    alias: "Stop Development Environment"
    sequence:
      - service: kubernetes.stop_workload
        data:
          workload_names:
            - switch.production_development_development_api
            - switch.production_development_development_database
          namespace: development
      - service: notify.mobile_app
        data:
          title: "Development Environment"
          message: "Development environment has been stopped"

  start_development:
    alias: "Start Development Environment"
    sequence:
      - service: kubernetes.start_workload
        data:
          workload_names:
            - switch.production_development_development_api
            - switch.production_development_development_database
          replicas: 1
          namespace: development
      - service: notify.mobile_app
        data:
          title: "Development Environment"
          message: "Development environment has been started"

  scale_production_databases:
    alias: "Scale Production Databases"
    sequence:
      - service: kubernetes.scale_workload
        data:
          workload_names:
            - switch.production_default_redis_cache
            - switch.production_default_postgres_db
          replicas: 3
          namespace: default
      - service: kubernetes.scale_workload
        data:
          workload_name: switch.production_default_postgres_db
          replicas: 2
          namespace: default

  stop_production_databases:
    alias: "Stop Production Databases"
    sequence:
      - service: kubernetes.stop_workload
        data:
          workload_names:
            - switch.production_default_redis_cache
            - switch.production_default_postgres_db
          namespace: default
      - service: notify.mobile_app
        data:
          title: "Production Databases"
          message: "Production databases have been stopped"

# Example scenes
scene:
  kubernetes_dashboard:
    name: "Kubernetes Dashboard"
    entities:
      sensor.production_pods_count:
        state: "0"
      sensor.production_nodes_count:
        state: "0"

      sensor.production_deployments_count:
        state: "0"
      sensor.production_statefulsets_count:
        state: "0"
      binary_sensor.production_cluster_health:
        state: "off"

  production_mode:
    name: "Production Mode"
    entities:
      sensor.production_pods_count:
        state: "50"
      sensor.production_deployments_count:
        state: "10"
      sensor.production_statefulsets_count:
        state: "3"

  development_mode:
    name: "Development Mode"
    entities:
      sensor.production_pods_count:
        state: "5"
      sensor.production_deployments_count:
        state: "3"
      sensor.production_statefulsets_count:
        state: "1"

# Lovelace dashboard configuration (optional)
# This creates a dedicated dashboard for Kubernetes monitoring and control
lovelace:
  mode: yaml
  dashboards:
    kubernetes:
      title: "Kubernetes Monitoring & Control"
      icon: mdi:kubernetes
      show_in_sidebar: true
      path: kubernetes
      badges: []
      cards:
        - type: vertical-stack
          title: "Kubernetes Cluster Status"
          cards:
            - type: entities
              title: "Cluster Health"
              entities:
                - entity: binary_sensor.production_cluster_health
            - type: entities
              title: "Resource Counts"
              entities:
                - entity: sensor.production_pods_count
                - entity: sensor.production_nodes_count

                - entity: sensor.production_deployments_count
                - entity: sensor.production_statefulsets_count
        - type: vertical-stack
          title: "Deployment Control"
          cards:
            - type: entities
              title: "Production Deployments"
              entities:
                - entity: switch.production_default_api
                - entity: switch.production_default_api_gateway
            - type: entities
              title: "Development Deployments"
              entities:
                - entity: switch.production_development_api
                - entity: switch.production_development_database
        - type: vertical-stack
          title: "StatefulSet Control"
          cards:
            - type: entities
              title: "Production StatefulSets"
              entities:
                - entity: switch.production_default_redis_cache
                - entity: switch.production_default_postgres_db
            - type: entities
              title: "Development StatefulSets"
              entities:
                - entity: switch.production_development_redis
        - type: vertical-stack
          title: "Quick Actions"
          cards:
            - type: button
              name: "Scale Production API"
              tap_action:
                action: call-service
                service: script.scale_production_api
            - type: button
              name: "Stop Development"
              tap_action:
                action: call-service
                service: script.stop_development
            - type: button
              name: "Start Development"
              tap_action:
                action: call-service
                service: script.start_development
            - type: button
              name: "Scale Production Databases"
              tap_action:
                action: call-service
                service: script.scale_production_databases
            - type: button
              name: "Stop Production Databases"
              tap_action:
                action: call-service
                service: script.stop_production_databases
