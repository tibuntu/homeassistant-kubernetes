apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homeassistant-kubernetes-integration
  labels:
    app.kubernetes.io/name: homeassistant-kubernetes-integration
    app.kubernetes.io/component: rbac
# Permissions for every integration feature. Each rule maps to a request the
# integration sends; docs/RBAC.md names the feature behind every verb.
# For a read-only setup use manifests/minimal/ (Helm: mode=minimal) instead.
rules:
  # --- Monitoring: read + Watch API, always cluster-wide ---
  # pods: `get` is the pod detail dialog in the sidebar panel
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # events: Cluster Events platform + events in the pod detail dialog
  - apiGroups: [""]
    resources: ["nodes", "services", "events"]
    verbs: ["list", "watch"]
  # namespaces: namespace selection in the config flow
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["list", "watch"]
  # cronjobs: `get` reads the job template when a CronJob is triggered
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["list", "watch"]
  # Gateway API HTTPRoutes and cert-manager Certificates are optional; the
  # rules are harmless when the CRDs are not installed. Secrets are never read.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["list", "watch"]
  # HPA detection (scale guard + HPA badge)
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list", "watch"]
  # Metrics API — CPU and memory usage (requires metrics-server)
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["list"]

  # --- Node control: cordon/uncordon (nodes have no namespace) ---
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["patch"]

  # --- Control of namespaced resources ---
  # Pod deletion from the sidebar panel
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  # drain_node service — evict pods through the Eviction API (honours PDBs)
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  # Pod log snapshots in the sidebar panel (opt-in "enable_pod_logs" option).
  # Logs can contain secrets.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Rollout restart
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["patch"]
  # Scaling (switches, replica numbers)
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["patch"]
  # CronJob suspend/resume
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["patch"]
  # CronJob triggering (creates a Job) and Job deletion
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete"]
