[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homeassistant-kubernetes"
version = "1.18.1"
description = "Home Assistant integration for Kubernetes monitoring"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Timo Hankamer", email = "huts-belay7o@icloud.com"}
]
keywords = ["homeassistant", "kubernetes", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]

# Home Assistant ships aiohttp, so the manifest lists no requirements. It is
# declared here unpinned so `pip install -e .` without Home Assistant (the
# k8s-compat job) still gets it and never fights Home Assistant's pin.
dependencies = [
    "aiohttp",
]

[project.optional-dependencies]
dev = [
    # Testing (pytest-homeassistant pins homeassistant, pytest and pytest-asyncio,
    # but not pytest-cov)
    "pytest-homeassistant==2026.11.3",
    "pytest-cov==7.1.0",

    # Linting and formatting
    "ruff==0.17.6",

    # Type checking
    "mypy==2.4.1",

    # Security
    "bandit[toml]==1.9.4",

    # Development tools
    "pre-commit==4.7.0",

    # Documentation
    "zensical==0.1.2",
]

# uv.lock covers the dev environment only, whose homeassistant pin needs a newer
# Python than requires-python (kept low for users on older Home Assistant).
# Raise this floor when a pytest-homeassistant bump raises
# Home Assistant's minimum Python, or `uv lock` cannot resolve.
[tool.uv]
environments = ["python_full_version >= '3.14.2'"]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "PIE", # flake8-pie
    "PLE", # pylint errors
    "PLW", # pylint warnings
    "G",   # flake8-logging-format
    "TID252", # relative imports (replaces the deleted python-import-check hook)
]
ignore = [
    "E501",    # line too long, handled by formatter
    "SIM117",  # 9 hits in 3 test files; merging nested `with` blocks (mocks/patches) is not a mechanical local fix
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
known-third-party = ["homeassistant", "aiohttp"]
combine-as-imports = true
force-sort-within-sections = true

[tool.mypy]
python_version = "3.13"
platform = "linux"
show_error_codes = true
follow_imports = "normal"
local_partial_types = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_unreachable = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = false
warn_no_return = false
# Home Assistant integration specific settings
ignore_missing_imports = true
allow_redefinition = true

[[tool.mypy.overrides]]
module = [
    "homeassistant.*",
    "voluptuous.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    # Load Home Assistant's plugin before every other one. Entry-point plugins
    # load in filesystem order, which differs between CI runners; when respx's
    # plugin came first it imported httpx before homeassistant could alias it
    # to httpx2, and pytest died at startup ("httpx was already imported").
    "-p", "pytest_homeassistant",
    "-v",
    "--tb=short",
    "--strict-config",
    "--strict-markers",
    "--cov=custom_components.kubernetes",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=95",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = [
    "k8s_compat: Kubernetes API compatibility tests (require a real cluster)",
]
filterwarnings = [
    # Warnings are errors (catches un-awaited coroutines via RuntimeWarning,
    # unclosed resources via ResourceWarning, etc.) except User/Deprecation
    # warnings; HA-specific deprecations are separately caught by the
    # autouse fail_on_ha_deprecations fixture (tests/conftest.py).
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["custom_components/kubernetes"]

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101", "B601"]  # Skip assert and shell usage in tests

[tool.bandit.assert_used]
skips = ["*_test.py", "*/test_*.py"]
