[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homeassistant-kubernetes"
version = "1.11.0"
description = "Home Assistant integration for Kubernetes monitoring"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Timo Hankamer", email = "huts-belay7o@icloud.com"}
]
keywords = ["homeassistant", "kubernetes", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]

dependencies = [
    "kubernetes==36.0.3",
]

[project.optional-dependencies]
dev = [
    # Testing (pytest-homeassistant-custom-component pins homeassistant, pytest, pytest-asyncio, pytest-cov)
    "pytest-homeassistant-custom-component==0.13.366",

    # Linting and formatting
    "ruff==0.16.8",

    # Type checking
    "mypy==2.3.1",

    # Security
    "bandit[toml]==1.9.4",

    # Development tools
    "pre-commit==4.6.2",

    # Documentation
    "zensical==0.0.64",
]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "PIE", # flake8-pie
    "PLE", # pylint errors
    "PLW", # pylint warnings
    "G",   # flake8-logging-format
    "TID252", # relative imports (replaces the deleted python-import-check hook)
]
ignore = [
    "E501",    # line too long, handled by formatter
    "B008",    # do not perform function calls in argument defaults
    "SIM117",  # 27 hits across 6 files; merging nested `with` blocks (mocks/patches) is not a mechanical local fix
    "PLW0603", # config_flow's lazy kubernetes-import cache intentionally rebinds module globals
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
known-third-party = ["homeassistant", "kubernetes", "aiohttp"]
combine-as-imports = true
force-sort-within-sections = true

[tool.mypy]
python_version = "3.13"
platform = "linux"
show_error_codes = true
follow_imports = "normal"
local_partial_types = true
strict_optional = false
warn_redundant_casts = true
warn_unused_ignores = false
warn_unreachable = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = false
warn_no_return = false
# Home Assistant integration specific settings
ignore_missing_imports = true
allow_redefinition = true

[[tool.mypy.overrides]]
module = [
    "kubernetes.*",
    "homeassistant.*",
    "voluptuous.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-config",
    "--strict-markers",
    "--cov=custom_components.kubernetes",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=95",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = [
    "k8s_compat: Kubernetes API compatibility tests (require a real cluster)",
    "kubernetes_unavailable: opt out of the config-flow kubernetes_available autouse fixture",
]
filterwarnings = [
    # HA deprecation warnings are already caught by the autouse
    # fail_on_ha_deprecations fixture (tests/conftest.py); "error" here plus
    # blanket ignores for User/DeprecationWarning canceled each other out.
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["custom_components/kubernetes"]
omit = [
    "tests/*",
    "*/site-packages/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\(Protocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101", "B601"]  # Skip assert and shell usage in tests

[tool.bandit.assert_used]
skips = ["*_test.py", "*/test_*.py"]
