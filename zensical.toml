[project]
site_name = "Kubernetes Home Assistant Integration"
site_description = "A Home Assistant integration for Kubernetes"
site_author = "Timo Hankamer"
# Canonical URL; navigation.instant needs it (it reads the sitemap).
site_url = "https://tibuntu.github.io/homeassistant-kubernetes/"
docs_dir = "docs"
repo_url = "https://github.com/tibuntu/homeassistant-kubernetes"
repo_name = "tibuntu/homeassistant-kubernetes"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; Timo Hankamer &mdash; MIT License"
# Local design notes (gitignored) must never end up in the site.
exclude_docs = """
/superpowers/
"""
nav = [
  {"Home" = "index.md"},
  {"Getting Started" = [
    {"Setup" = "SETUP.md"},
    {"Configuration" = "CONFIGURATION.md"},
    {"RBAC" = "RBAC.md"},
  ]},
  {"Features" = [
    {"Entities" = "ENTITIES.md"},
    {"Entity Management" = "ENTITY_MANAGEMENT.md"},
    {"Services" = "SERVICES.md"},
    {"CronJobs" = "CRONJOBS.md"},
    {"Examples" = "EXAMPLES.md"},
  ]},
  {"Reference" = [
    {"Logging" = "LOGGING.md"},
    {"Troubleshooting" = "TROUBLESHOOTING.md"},
  ]},
  {"Development" = "DEVELOPMENT.md"},
]

[project.theme]
variant = "modern"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "simple/kubernetes"
repo = "fontawesome/brands/github"

# Three-state toggle: follow the OS, then light, then dark.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "blue"
accent = "light blue"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue"
accent = "light blue"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "light blue"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/tibuntu/homeassistant-kubernetes"
name = "Source on GitHub"

# Setting markdown_extensions replaces Zensical's defaults, so list them all.
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
# GitHub-style "> [!NOTE]" callouts render as admonitions.
pymdownx.quotes.callouts = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
